name: Build and deploy Aurora

on:
  push:
    branches:
      - develop
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: aurora-ec2-deploy
  cancel-in-progress: false

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        working-directory: src/backend
        run: uv sync --locked --all-groups

      - name: Run backend tests
        working-directory: src/backend
        run: uv run pytest

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: src/frontend
        run: npm ci

      - name: Build frontend
        working-directory: src/frontend
        run: npm run build

  publish-images:
    needs:
      - backend-tests
      - frontend-build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      DOCKER_METADATA_SHORT_SHA_LENGTH: 40
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare backend image tags
        id: backend-meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/aurora-backend
          tags: |
            type=sha,prefix=sha-
            type=ref,event=tag
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/develop' }}

      - name: Build and publish backend image
        uses: docker/build-push-action@v6
        with:
          context: ./src/backend
          push: true
          tags: ${{ steps.backend-meta.outputs.tags }}
          labels: ${{ steps.backend-meta.outputs.labels }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Prepare frontend image tags
        id: frontend-meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/aurora-frontend
          tags: |
            type=sha,prefix=sha-
            type=ref,event=tag
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/develop' }}

      - name: Build and publish frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./src/frontend
          push: true
          tags: ${{ steps.frontend-meta.outputs.tags }}
          labels: ${{ steps.frontend-meta.outputs.labels }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  deploy-ec2:
    if: github.ref == 'refs/heads/develop'
    needs: publish-images
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure SSH
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_KNOWN_HOSTS: ${{ secrets.EC2_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$EC2_SSH_KEY"
          test -n "$EC2_KNOWN_HOSTS"
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$EC2_SSH_KEY" > "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$EC2_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/id_ed25519" "$HOME/.ssh/known_hosts"

      - name: Copy production Compose file
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          set -euo pipefail
          test -n "$EC2_HOST"
          ssh -i "$HOME/.ssh/id_ed25519" \
            -o StrictHostKeyChecking=yes \
            "ec2-user@$EC2_HOST" \
            "sudo mkdir -p /opt/aurora"
          scp -i "$HOME/.ssh/id_ed25519" \
            -o StrictHostKeyChecking=yes \
            docker-compose.prod.yml \
            "ec2-user@$EC2_HOST:/tmp/aurora-compose.yml"

      - name: Deploy images to EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_READ_TOKEN: ${{ secrets.GHCR_READ_TOKEN }}
          IMAGE_OWNER: ${{ github.repository_owner }}
          IMAGE_TAG: sha-${{ github.sha }}
        run: |
          set -euo pipefail
          test -n "$GHCR_USERNAME"
          test -n "$GHCR_READ_TOKEN"
          printf '%s' "$GHCR_READ_TOKEN" | ssh \
            -i "$HOME/.ssh/id_ed25519" \
            -o StrictHostKeyChecking=yes \
            "ec2-user@$EC2_HOST" \
            "sudo docker login ghcr.io --username '$GHCR_USERNAME' --password-stdin && \
             sudo install -o root -g root -m 644 /tmp/aurora-compose.yml /opt/aurora/docker-compose.prod.yml && \
             printf 'IMAGE_OWNER=%s\nIMAGE_TAG=%s\n' '$IMAGE_OWNER' '$IMAGE_TAG' | sudo tee /opt/aurora/.env >/dev/null && \
             cd /opt/aurora && \
             sudo docker compose -f docker-compose.prod.yml pull && \
             sudo docker compose -f docker-compose.prod.yml up -d --remove-orphans"
