name: Avaliação essencial v1.2 (LLM)

# Teste essencial do motor llm com o LLM real: 1 caso por categoria (risco, escopo,
# pergunta da base, fora da base, adversarial), sem juiz, em menos de 2 minutos.
# Roda nos PRs para release e sob demanda. Único workflow com a chave do LLM.
# A avaliação completa e a revisão humana ficam com o time de produto (F3).
on:
  pull_request:
    branches:
      - release
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aurora-eval-${{ github.ref }}
  cancel-in-progress: true

jobs:
  essential-eval:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    env:
      AURORA_LLM_PROVIDER: gemini
      AURORA_LLM_MODEL: gemini-3.5-flash-lite
      AURORA_AGENTIC_SEARCH: "true"
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - name: Check secret
        id: secret
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "::warning::Secret GEMINI_API_KEY ausente: avaliação essencial não executada."
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out repository
        if: steps.secret.outputs.present == 'true'
        uses: actions/checkout@v4

      - name: Set up uv and Python
        if: steps.secret.outputs.present == 'true'
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        if: steps.secret.outputs.present == 'true'
        working-directory: src/backend
        run: uv sync --locked --all-groups

      - name: Run essential evaluation
        if: steps.secret.outputs.present == 'true'
        working-directory: src/backend
        run: uv run python -u evals/v1_2/run_answer_eval.py --check --rpm 15
