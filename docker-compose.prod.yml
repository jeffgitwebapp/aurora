services:
  backend:
    image: ghcr.io/${IMAGE_OWNER:?Set IMAGE_OWNER}/aurora-backend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    # Motor do chat e LLM (AURORA_CHAT_ENGINE, AURORA_LLM_*, chave do provedor).
    # Criado à mão na EC2 (root, chmod 600) e nunca reescrito pelo workflow.
    # Sem o arquivo, o backend sobe com as fixtures do protótipo.
    env_file:
      - path: backend.env
        required: false
    expose:
      - "8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/docs')"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  frontend:
    image: ghcr.io/${IMAGE_OWNER:?Set IMAGE_OWNER}/aurora-frontend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - wget
        - -q
        - -O
        - /dev/null
        - http://127.0.0.1/
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
